<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Aktivität</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            color: #172033;
        }

        .card {
            width: 100%;
            max-width: 480px;

            background: white;

            border-radius: 24px;

            padding: 35px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.10);
        }

        .logo {
            width: 60px;
            height: 60px;

            border-radius: 18px;

            background: #4f46e5;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;

            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 10px;

            font-size: 28px;
        }

        p {
            color: #64748b;

            line-height: 1.5;
        }

        .activity {
            background: #eef2ff;

            padding: 16px;

            border-radius: 12px;

            margin: 20px 0;

            color: #3730a3;

            font-weight: bold;
        }

        label {
            display: block;

            margin-top: 25px;
            margin-bottom: 8px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 15px;

            border:
                1px solid
                #dbe1ea;

            border-radius: 12px;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
        }

        button {
            width: 100%;

            border: none;

            border-radius: 12px;

            padding: 15px;

            margin-top: 15px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }

        .primary {
            background: #4f46e5;

            color: white;
        }

        .primary:hover {
            background: #4338ca;
        }

        .anonymous {
            background: #f1f5f9;

            color: #334155;
        }

        .anonymous:hover {
            background: #e2e8f0;
        }

        .error {
            background: #fee2e2;

            color: #991b1b;

            padding: 12px;

            border-radius: 10px;

            margin-top: 15px;

            display: none;
        }

        .loading {
            text-align: center;

            color: #64748b;
        }

        .small {
            font-size: 13px;

            color: #94a3b8;

            margin-top: 20px;

            line-height: 1.5;
        }

    </style>

</head>

<body>

<div class="card">

    <!-- LADEN -->

    <div id="loading" class="loading">

        Aktivität wird geladen...

    </div>


    <!-- HAUPTSEITE -->

    <div
        id="content"
        style="display:none;"
    >

        <div class="logo">
            📚
        </div>


        <h1>
            Bereit zum Starten?
        </h1>


        <p>
            Gib deinen Namen ein, damit dein Lehrer
            sehen kann, wer teilnimmt.
        </p>


        <div class="activity">

            Aktivität:

            <span id="activityName">
            </span>

        </div>


        <!-- NAME -->

        <form id="nameForm">

            <label for="name">

                Vor- und Nachname

            </label>


            <input
                id="name"
                type="text"
                maxlength="100"
                placeholder="Beispiel: Max Mustermann"
                autocomplete="name"
            >


            <button
                type="submit"
                class="primary"
                id="submitButton"
            >

                Weiter

            </button>

        </form>


        <!-- ANONYM -->

        <button
            class="anonymous"
            id="anonymousButton"
        >

            Anonym weiter

        </button>


        <!-- FEHLER -->

        <div
            id="error"
            class="error"
        >
        </div>


        <div class="small">

            Die Angabe deines Namens ist freiwillig.
            Sie hilft dem Lehrer, die Teilnahmen zu verfolgen.

        </div>

    </div>

</div>


<script src="config.js"></script>


<script>

    // =====================================================
    // SUPABASE
    // =====================================================

    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // =====================================================
    // CODE DES LINKS ERMITTELN
    // =====================================================

    const params =
        new URLSearchParams(
            window.location.search
        );


    const code =
        params.get("code");


    // =====================================================
    // ELEMENTE
    // =====================================================

    const loading =
        document.getElementById(
            "loading"
        );


    const content =
        document.getElementById(
            "content"
        );


    const activityName =
        document.getElementById(
            "activityName"
        );


    const nameForm =
        document.getElementById(
            "nameForm"
        );


    const nameInput =
        document.getElementById(
            "name"
        );


    const submitButton =
        document.getElementById(
            "submitButton"
        );


    const anonymousButton =
        document.getElementById(
            "anonymousButton"
        );


    const errorBox =
        document.getElementById(
            "error"
        );


    // =====================================================
    // FEHLER
    // =====================================================

    function showError(message) {

        errorBox.textContent =
            message;

        errorBox.style.display =
            "block";

    }


    function hideError() {

        errorBox.style.display =
            "none";

    }


    // =====================================================
    // AKTIVITÄT LADEN
    // =====================================================

    async function loadActivity() {

        /*
         * Wenn kein Code vorhanden ist
         */

        if (!code) {

            loading.textContent =
                "Ungültiger Link.";

            return;
        }


        /*
         * Wir fragen Supabase:
         *
         * "Welche Aktivität gehört zu diesem Code?"
         *
         * Beispiel:
         *
         * A7K92P
         *
         * wird:
         *
         * Aktivität = Übung 1
         * URL = https://...
         */

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "get_activity",
                {
                    p_code: code
                }
            );


        /*
         * Unbekannter Code
         */

        if (
            error ||
            !data ||
            data.length === 0
        ) {

            loading.textContent =
                "Diese Aktivität existiert nicht.";

            return;
        }


        /*
         * Aktivität gefunden
         */

        const activity =
            data[0];


        activityName.textContent =
            activity.name;


        /*
         * Seite anzeigen
         */

        loading.style.display =
            "none";

        content.style.display =
            "block";

    }


    // =====================================================
    // TEILNAHME SPEICHERN
    // =====================================================

    async function sendVisit(
        name,
        anonymous
    ) {

        hideError();


        /*
         * Buttons deaktivieren,
         * während die Teilnahme gespeichert wird
         */

        submitButton.disabled =
            true;

        anonymousButton.disabled =
            true;


        /*
         * Teilnahme speichern
         */

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "record_visit",
                {
                    p_code: code,

                    p_name:
                        anonymous
                            ? null
                            : name,

                    p_anonymous:
                        anonymous
                }
            );


        /*
         * Fehler
         */

        if (error) {

            console.error(error);


            submitButton.disabled =
                false;

            anonymousButton.disabled =
                false;


            if (
                error.message
                    .includes(
                        "NAME_REQUIRED"
                    )
            ) {

                showError(
                    "Bitte gib deinen Namen an."
                );

            } else {

                showError(
                    "Die Teilnahme konnte nicht gespeichert werden."
                );

            }

            return;
        }


        /*
         * WEITERLEITUNG
         *
         * Wichtig:
         *
         * Supabase gibt die URL zurück,
         * die zu diesem Code gehört.
         *
         * Deshalb bleibt ein alter Link
         * weiterhin mit der alten Aktivität verknüpft.
         */

        if (
            data &&
            data.activity_url
        ) {

            window.location.href =
                data.activity_url;

        } else {

            showError(
                "Die Aktivität wurde nicht gefunden."
            );


            submitButton.disabled =
                false;

            anonymousButton.disabled =
                false;

        }

    }


    // =====================================================
    // NAME
    // =====================================================

    nameForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const name =
                nameInput.value.trim();


            if (!name) {

                showError(
                    "Bitte gib deinen Vor- und Nachnamen ein."
                );

                return;
            }


            await sendVisit(
                name,
                false
            );

        }
    );


    // =====================================================
    // ANONYM
    // =====================================================

    anonymousButton.addEventListener(
        "click",
        async function() {

            await sendVisit(
                null,
                true
            );

        }
    );


    // =====================================================
    // START
    // =====================================================

    loadActivity();

</script>

</body>

</html>
